    - artificial intelligence
    - machine learning
    - llm
    - engineering
    - developer
    - cloud
    - data
    - security
    - devops
    - kubernetes
    - python
    - javascript
    - systems
    - hackathon
    - buildathon
  exclude:
    - product management
    - founder
    - startup pitch
    - sales
    - career fair
    - networking mixer

