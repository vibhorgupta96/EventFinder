# Public, unauthenticated pages only. The service never bypasses robots, CAPTCHAs, or access controls.
sources:
  - name: luma_bengaluru
    adapter: public_page
    platform: luma
    # lu.ma (including robots.txt) 301-redirects to luma.com; a cross-domain
    # robots redirect fails closed, so use the canonical public domain.
    url: https://luma.com/bengaluru
    allowed_domains: [luma.com]
    detail_link_selectors: ["a.event-link[href^='/']"]
    max_detail_pages: 4
    enabled: true
    priority: true
    cadence_hours: 3
    rate_limit_seconds: 3
  # Meetup's robots.txt disallows this search (`Disallow: /*?location=*` in a
  # later `User-agent: *` group); the meetup_* group sources cover Meetup.
  - name: meetup_bengaluru
    adapter: public_page
    platform: meetup
    url: https://www.meetup.com/find/?location=in--Bengaluru
    allowed_domains: [meetup.com]
    enabled: false
    priority: true
    cadence_hours: 3
    rate_limit_seconds: 4
    max_pages: 2
    pagination_param: page
  - name: hasgeek
    adapter: public_page
    platform: hasgeek
    url: https://hasgeek.com/
    allowed_domains: [hasgeek.com]
    detail_link_selectors: ["ul.upcoming a.card--upcoming[href]"]
    max_detail_pages: 4
    enabled: true
    priority: true
    cadence_hours: 3
    rate_limit_seconds: 3
  - name: devfolio
    adapter: public_page
    platform: devfolio
    url: https://devfolio.co/hackathons
    allowed_domains: [devfolio.co]
