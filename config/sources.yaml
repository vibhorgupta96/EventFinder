  - name: cncf_bengaluru
    adapter: public_page
    # Open Community Groups (ocgroups.dev) serves CNCF chapter pages. The
    # community.cncf.io vanity URL's robots.txt redirects to community2.cncf.io,
    # outside this boundary, so it fails closed; use the canonical public page.
    # ocgroups.dev is a multi-community transport, never an organizer identity.
    platform: ocg
    url: https://ocgroups.dev/cncf/group/52r68y4
    allowed_domains: [ocgroups.dev]
    detail_link_selectors:
      - "div:has(> div:-soup-contains-own('Next event')) > a[href*='/cncf/group/52r68y4/event/']"
      - "div:has(> div > div:-soup-contains-own('Upcoming Events')) a[href*='/cncf/group/52r68y4/event/']"
