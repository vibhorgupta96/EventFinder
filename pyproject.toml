[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eventfinder"
version = "0.1.0"
description = "A local, read-only discovery service for Bengaluru and online engineering events."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EventFinder" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9.0,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "loguru>=0.7,<1",
  "pydantic-settings>=2.4,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "sqlmodel>=0.0.22,<0.1",
  "tenacity>=9.0,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
eventfinder = "eventfinder.main:run"
eventfinderctl = "eventfinder.lifecycle:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["eventfinder", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["eventfinder"]
